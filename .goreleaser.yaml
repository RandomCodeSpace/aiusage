# GoReleaser config for aiusage — cross-platform binaries, archives and
# checksums attached to a GitHub Release. Version is derived from the git tag
# (vX.Y.Z) and injected into the binary via ldflags so `aiusage version` and the
# CLI/daemon version-sync report the real release version instead of "dev".
#
# The release binary embeds the web UI, so internal/web/dist must already hold
# a Vite build before this config runs (release.yml does that in a workflow
# step; see the builds' tags field below).
#
# Local dry run:
#   (cd webui && npm ci && npm run build)
#   goreleaser release --snapshot --clean --skip=publish
version: 2

project_name: aiusage

before:
  hooks:
    # Verify tidiness rather than tidy: hooks run AFTER goreleaser's dirty-tree
    # check, so a plain `go mod tidy` here would silently release from module
    # files that were never committed. -diff exits non-zero when go.mod/go.sum
    # would change; fix and re-tag instead.
    - go mod tidy -diff

builds:
  - id: aiusage
    main: .
    binary: aiusage
    env:
      - CGO_ENABLED=0
    # Linux and macOS only. aiusage is a Unix tool: the daemon uses flock
    # (syscall.Flock) and the resource monitor uses statfs (syscall.Statfs),
    # neither of which exists on Windows — and the monitor reads /sys/fs/cgroup,
    # which is Linux-specific anyway. Windows is intentionally not a target.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Releases ship the embedded web UI: this tag selects internal/web's
    # embed_webui.go over its !webui stub, and its //go:embed all:dist requires
    # internal/web/dist to exist at compile time. Not compiling when the assets
    # are missing is the intended failure - a release that silently served an
    # empty page would be worse.
    tags:
      - webui
    ldflags:
      - -s -w -X github.com/RandomCodeSpace/aiusage/internal/buildinfo.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
