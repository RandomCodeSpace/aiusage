name: Release

# Serial, fail-closed publication for one captured commit on main. Rehearsal
# artifacts run on every advertised native target and through both real user
# managers before a tag exists. Downloaded draft bytes repeat the native matrix
# before publication. Published tags and assets are never replaced.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (vMAJOR.MINOR.PATCH or prerelease)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: aiusage-release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare exact candidate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout captured candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify candidate and exact CI
        id: preflight
        run: ./scripts/release-preflight.sh "$VERSION" "$CANDIDATE_SHA" "$RUN_ATTEMPT" "$GITHUB_OUTPUT"

      - name: Recheck coverage artifact
        env:
          ARTIFACT_ID: ${{ steps.preflight.outputs.coverage_artifact_id }}
        run: |
          archive="$RUNNER_TEMP/coverage.zip"
          evidence="$RUNNER_TEMP/coverage"
          mkdir -p "$evidence"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" >"$archive"
          unzip -q "$archive" -d "$evidence"
          mapfile -t profiles < <(find "$evidence" -type f -name coverage.out)
          if [ "${#profiles[@]}" -ne 1 ]; then
            echo "::error::coverage artifact must contain exactly one coverage.out"
            exit 1
          fi
          coverage="$(go tool cover -func="${profiles[0]}" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          if [ -z "$coverage" ]; then
            echo "::error::coverage artifact has no total statement coverage"
            exit 1
          fi
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 84.1) exit 1 }' || {
            echo "::error::statement coverage ${coverage}% is below the 84.1% floor"
            exit 1
          }
          echo "statement coverage ${coverage}%"

      - name: Recheck adapter compatibility artifact
        env:
          ARTIFACT_ID: ${{ steps.preflight.outputs.adapter_artifact_id }}
        run: |
          archive="$RUNNER_TEMP/adapter-compatibility.zip"
          evidence="$RUNNER_TEMP/adapter-compatibility"
          mkdir -p "$evidence"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" >"$archive"
          unzip -q "$archive" -d "$evidence"
          mapfile -t manifests < <(find "$evidence" -type f -name compatibility.json)
          mapfile -t results < <(find "$evidence" -type f -name result.json)
          if [ "${#manifests[@]}" -ne 1 ] || [ "${#results[@]}" -ne 1 ]; then
            echo "::error::adapter artifact must contain exactly one compatibility.json and one result.json"
            exit 1
          fi
          cmp adapter/compatibility.json "${manifests[0]}"
          manifest_sha="$(sha256sum "${manifests[0]}" | awk '{print $1}')"
          jq -e --arg manifest_sha "$manifest_sha" '
            .schema == "adapter-compatibility-result-v1" and
            .manifest_sha256 == $manifest_sha and
            .mode == "ci" and
            .registered == 15 and
            .ready == 15 and
            .complete == true and
            (.pending | length) == 0 and
            (.errors | length) == 0
          ' "${results[0]}" >/dev/null || {
            echo "::error::adapter compatibility artifact is incomplete"
            jq '{registered, ready, complete, pending, errors}' "${results[0]}"
            exit 1
          }

      - name: Revalidate fresh adapter evidence before rehearsal
        run: go run ./internal/adaptercompatcheck --mode release >/dev/null

      - name: Install external examples from candidate
        run: |
          install_root="$(mktemp -d "$RUNNER_TEMP/aiusage-examples.XXXXXX")"
          export GOBIN="$install_root/bin"
          export GOCACHE="$install_root/build-cache"
          export GOMODCACHE="$install_root/module-cache"
          export GOPROXY=direct
          mkdir -p "$GOBIN"
          for example in collect-once custom-adapter report-totals; do
            go install "github.com/RandomCodeSpace/aiusage/examples/${example}@${CANDIDATE_SHA}"
            test -x "$GOBIN/$example"
          done

      - name: Prepare local annotated tag
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            peeled="$(git rev-parse "refs/tags/$VERSION^{}")"
            if [ "$peeled" != "$CANDIDATE_SHA" ]; then
              echo "::error::local tag $VERSION does not peel to $CANDIDATE_SHA"
              exit 1
            fi
            if [ "$(git cat-file -t "refs/tags/$VERSION")" != tag ]; then
              echo "::error::$VERSION is not an annotated tag"
              exit 1
            fi
          else
            git tag -a "$VERSION" "$CANDIDATE_SHA" -m "Release $VERSION"
          fi

      - name: Build rehearsal without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify rehearsal payload
        run: |
          rehearsal="$RUNNER_TEMP/rehearsal-assets"
          mkdir -p "$rehearsal"
          cp dist/*.tar.gz dist/checksums.txt "$rehearsal/"
          ./scripts/verify-release-assets.sh "$VERSION" "$rehearsal" "$CANDIDATE_SHA"

      - name: Resolve archive version
        id: archive
        run: echo "version=${VERSION#v}" >>"$GITHUB_OUTPUT"

      - name: Upload linux amd64 rehearsal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-linux-amd64
          path: |
            dist/aiusage_${{ steps.archive.outputs.version }}_linux_amd64.tar.gz
            dist/checksums.txt
          if-no-files-found: error

      - name: Upload linux arm64 rehearsal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-linux-arm64
          path: |
            dist/aiusage_${{ steps.archive.outputs.version }}_linux_arm64.tar.gz
            dist/checksums.txt
          if-no-files-found: error

      - name: Upload macOS amd64 rehearsal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-darwin-amd64
          path: |
            dist/aiusage_${{ steps.archive.outputs.version }}_darwin_amd64.tar.gz
            dist/checksums.txt
          if-no-files-found: error

      - name: Upload macOS arm64 rehearsal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-darwin-arm64
          path: |
            dist/aiusage_${{ steps.archive.outputs.version }}_darwin_arm64.tar.gz
            dist/checksums.txt
          if-no-files-found: error

  native-rehearsal:
    name: rehearsal smoke / ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rehearsal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/assets

      - name: Run native product smoke
        env:
          ASSET_DIR: ${{ runner.temp }}/assets
          CANDIDATE_SHA: ${{ github.sha }}
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/native-artifact-smoke.sh "$VERSION" "$CANDIDATE_SHA" "$GOOS" "$GOARCH" "$ASSET_DIR"

  linux-lifecycle:
    name: real systemd user lifecycle
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rehearsal-linux-amd64
          path: ${{ runner.temp }}/assets

      - name: Verify lifecycle artifact
        env:
          ASSET_DIR: ${{ runner.temp }}/assets
          CANDIDATE_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/native-artifact-smoke.sh "$VERSION" "$CANDIDATE_SHA" linux amd64 "$ASSET_DIR"

      - name: Exercise real systemd manager
        env:
          ASSET_DIR: ${{ runner.temp }}/assets
          CANDIDATE_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/linux-service-lifecycle.sh "$VERSION" "$CANDIDATE_SHA" "$ASSET_DIR"

  macos-lifecycle:
    name: real launchd GUI lifecycle
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rehearsal-darwin-arm64
          path: ${{ runner.temp }}/assets

      - name: Verify lifecycle artifact
        env:
          ASSET_DIR: ${{ runner.temp }}/assets
          CANDIDATE_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/native-artifact-smoke.sh "$VERSION" "$CANDIDATE_SHA" darwin arm64 "$ASSET_DIR"

      - name: Exercise real launchd manager
        env:
          ASSET_DIR: ${{ runner.temp }}/assets
          CANDIDATE_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/macos-service-lifecycle.sh "$VERSION" "$CANDIDATE_SHA" "$ASSET_DIR"

  draft:
    name: create verified draft
    needs: [native-rehearsal, linux-lifecycle, macos-lifecycle]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      ci_run_id: ${{ steps.preflight.outputs.ci_run_id }}
      ci_run_url: ${{ steps.preflight.outputs.ci_run_url }}
      release_id: ${{ steps.draft.outputs.release_id }}
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout captured candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Recheck candidate and exact CI before tag
        id: preflight
        run: ./scripts/release-preflight.sh "$VERSION" "$CANDIDATE_SHA" "$RUN_ATTEMPT" "$GITHUB_OUTPUT"

      - name: Revalidate fresh adapter evidence before tag
        run: go run ./internal/adaptercompatcheck --mode release >/dev/null

      - name: Prepare immutable annotated tag
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            peeled="$(git rev-parse "refs/tags/$VERSION^{}")"
            if [ "$peeled" != "$CANDIDATE_SHA" ]; then
              echo "::error::local tag $VERSION does not peel to $CANDIDATE_SHA"
              exit 1
            fi
            if [ "$(git cat-file -t "refs/tags/$VERSION")" != tag ]; then
              echo "::error::$VERSION is not an annotated tag"
              exit 1
            fi
          else
            git tag -a "$VERSION" "$CANDIDATE_SHA" -m "Release $VERSION"
          fi

      - name: Push or verify immutable tag
        id: push_tag
        run: |
          ./scripts/release-preflight.sh "$VERSION" "$CANDIDATE_SHA" "$RUN_ATTEMPT"
          remote_tag_output="$(git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}")"
          remote_tags=()
          if [ -n "$remote_tag_output" ]; then
            mapfile -t remote_tags <<<"$remote_tag_output"
          fi
          if [ "${#remote_tags[@]}" -eq 0 ]; then
            git push origin "refs/tags/$VERSION"
          else
            peeled="$(printf '%s\n' "${remote_tags[@]}" | awk '$2 ~ /\^\{\}$/ {print $1}')"
            if [ "$peeled" != "$CANDIDATE_SHA" ]; then
              echo "::error::remote tag $VERSION does not peel to $CANDIDATE_SHA"
              exit 1
            fi
          fi

      - name: Build draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify draft build payload
        run: |
          draft_build="$RUNNER_TEMP/draft-build-assets"
          mkdir -p "$draft_build"
          cp dist/*.tar.gz dist/checksums.txt "$draft_build/"
          ./scripts/verify-release-assets.sh "$VERSION" "$draft_build" "$CANDIDATE_SHA"

      - name: Download and verify draft release
        id: draft
        run: |
          release_json="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,isDraft,tagName,targetCommitish \
            --jq '{id: .databaseId, draft: .isDraft, tag_name: .tagName, target_commitish: .targetCommitish}')"
          release_id="$(jq -r .id <<<"$release_json")"
          if [ "$(jq -r .draft <<<"$release_json")" != true ]; then
            echo "::error::release $VERSION is not a draft"
            exit 1
          fi
          if [ "$(jq -r .tag_name <<<"$release_json")" != "$VERSION" ]; then
            echo "::error::draft release tag differs from $VERSION"
            exit 1
          fi
          if [ "$(jq -r .target_commitish <<<"$release_json")" != "$CANDIDATE_SHA" ]; then
            echo "::error::draft release target differs from $CANDIDATE_SHA"
            exit 1
          fi
          draft_assets="$RUNNER_TEMP/downloaded-draft-assets"
          mkdir -p "$draft_assets"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$draft_assets"
          ./scripts/verify-release-assets.sh "$VERSION" "$draft_assets" "$CANDIDATE_SHA"
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"

      - name: Resolve archive version
        id: archive
        run: echo "version=${VERSION#v}" >>"$GITHUB_OUTPUT"

      - name: Upload linux amd64 draft bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-linux-amd64
          path: |
            ${{ runner.temp }}/downloaded-draft-assets/aiusage_${{ steps.archive.outputs.version }}_linux_amd64.tar.gz
            ${{ runner.temp }}/downloaded-draft-assets/checksums.txt
          if-no-files-found: error

      - name: Upload linux arm64 draft bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-linux-arm64
          path: |
            ${{ runner.temp }}/downloaded-draft-assets/aiusage_${{ steps.archive.outputs.version }}_linux_arm64.tar.gz
            ${{ runner.temp }}/downloaded-draft-assets/checksums.txt
          if-no-files-found: error

      - name: Upload macOS amd64 draft bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-darwin-amd64
          path: |
            ${{ runner.temp }}/downloaded-draft-assets/aiusage_${{ steps.archive.outputs.version }}_darwin_amd64.tar.gz
            ${{ runner.temp }}/downloaded-draft-assets/checksums.txt
          if-no-files-found: error

      - name: Upload macOS arm64 draft bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-darwin-arm64
          path: |
            ${{ runner.temp }}/downloaded-draft-assets/aiusage_${{ steps.archive.outputs.version }}_darwin_arm64.tar.gz
            ${{ runner.temp }}/downloaded-draft-assets/checksums.txt
          if-no-files-found: error

      - name: Keep any failed tagged release private
        if: failure() && steps.push_tag.outcome == 'success'
        run: |
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" 2>/dev/null || true)"
          if [ -n "$release_json" ] && [ "$(jq -r .draft <<<"$release_json")" = false ]; then
            release_id="$(jq -r .id <<<"$release_json")"
            if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=true >/dev/null; then
              echo "::warning::could not return release $VERSION to draft; tag remains immutable"
            fi
          fi

  native-draft:
    name: draft smoke / ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: draft
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draft-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/assets

      - name: Run native draft smoke
        env:
          ASSET_DIR: ${{ runner.temp }}/assets
          CANDIDATE_SHA: ${{ github.sha }}
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/native-artifact-smoke.sh "$VERSION" "$CANDIDATE_SHA" "$GOOS" "$GOARCH" "$ASSET_DIR"

  publish:
    name: publish verified draft
    needs: [draft, native-draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout captured candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Revalidate fresh adapter evidence before publication
        run: go run ./internal/adaptercompatcheck --mode release >/dev/null

      - name: Confirm the verified release is still a draft
        env:
          EXPECTED_RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$EXPECTED_RELEASE_ID")"
          if [ "$(jq -r .id <<<"$release_json")" != "$EXPECTED_RELEASE_ID" ]; then
            echo "::error::draft release identity changed after native verification"
            exit 1
          fi
          if [ "$(jq -r .tag_name <<<"$release_json")" != "$VERSION" ]; then
            echo "::error::verified release tag differs from $VERSION"
            exit 1
          fi
          if [ "$(jq -r .draft <<<"$release_json")" != true ]; then
            echo "::error::release $VERSION is no longer a draft"
            exit 1
          fi
          if [ "$(jq -r .target_commitish <<<"$release_json")" != "$CANDIDATE_SHA" ]; then
            echo "::error::draft release target differs from $CANDIDATE_SHA"
            exit 1
          fi

      - name: Publish verified release
        id: publish
        env:
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false >/dev/null

      - name: Verify public release
        id: public
        run: |
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")"
          if [ "$(jq -r .draft <<<"$release_json")" != false ]; then
            echo "::error::release $VERSION is not public"
            exit 1
          fi
          public_assets="$RUNNER_TEMP/downloaded-public-assets"
          mkdir -p "$public_assets"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$public_assets"
          ./scripts/verify-release-assets.sh "$VERSION" "$public_assets" "$CANDIDATE_SHA" | tee "$RUNNER_TEMP/public-sha256.txt"
          remote_tag_output="$(git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}")"
          remote_tags=()
          if [ -n "$remote_tag_output" ]; then
            mapfile -t remote_tags <<<"$remote_tag_output"
          fi
          peeled="$(printf '%s\n' "${remote_tags[@]}" | awk '$2 ~ /\^\{\}$/ {print $1}')"
          if [ "$peeled" != "$CANDIDATE_SHA" ]; then
            echo "::error::public tag $VERSION does not peel to $CANDIDATE_SHA"
            exit 1
          fi
          tag_sha="$(printf '%s\n' "${remote_tags[@]}" | awk -v ref="refs/tags/$VERSION" '$2 == ref {print $1}')"
          echo "tag_sha=$tag_sha" >>"$GITHUB_OUTPUT"
          echo "release_url=$(jq -r .html_url <<<"$release_json")" >>"$GITHUB_OUTPUT"

      - name: Record release evidence
        if: success()
        env:
          CI_RUN_ID: ${{ needs.draft.outputs.ci_run_id }}
          CI_RUN_URL: ${{ needs.draft.outputs.ci_run_url }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          RELEASE_URL: ${{ steps.public.outputs.release_url }}
          TAG_SHA: ${{ steps.public.outputs.tag_sha }}
        run: |
          {
            echo "## Published $VERSION"
            echo
            echo "| Evidence | Value |"
            echo "| --- | --- |"
            echo "| Candidate commit | $CANDIDATE_SHA |"
            echo "| Push CI | [$CI_RUN_ID]($CI_RUN_URL) |"
            echo "| Release run | [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
            echo "| Release | [$RELEASE_ID]($RELEASE_URL) |"
            echo "| Annotated tag object | $TAG_SHA |"
            echo
            echo '~~~text'
            cat "$RUNNER_TEMP/public-sha256.txt"
            echo '~~~'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Return a failed public release to draft
        if: failure()
        run: |
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" 2>/dev/null || true)"
          if [ -n "$release_json" ] && [ "$(jq -r .draft <<<"$release_json")" = false ]; then
            release_id="$(jq -r .id <<<"$release_json")"
            if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=true >/dev/null; then
              echo "::warning::could not return release $VERSION to draft; tag remains immutable"
            fi
          fi
