name: Release

# Cuts a GitHub Release when a version tag (vX.Y.Z) is pushed: builds the web
# UI, then cross-compiles linux/darwin for amd64+arm64 (Windows is
# intentionally not a target — see .goreleaser.yaml), builds archives +
# checksums, and injects the tag version into the binary via ldflags.
# Versioning is tag-driven — `git tag v1.2.3 && git push origin v1.2.3`.
#
# The Vite build runs here, as a workflow step, and not as a GoReleaser
# before-hook: hooks are plain strings, word-split and run without a shell, and
# there is no per-hook working directory, so `cd webui && npm ci` is not
# expressible. Order is load-bearing: .goreleaser.yaml builds with
# `-tags webui`, whose //go:embed all:dist fails to compile unless
# internal/web/dist already holds the built assets.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: build web UI
        working-directory: webui
        run: |
          npm ci
          npm run build

      # Fail here, with a sentence, rather than inside a cross-compile loop
      # with an embed error. internal/web/dist is gitignored, so GoReleaser's
      # dirty-tree check is unaffected by what this produced.
      - name: verify embedded assets
        run: |
          if [ ! -f internal/web/dist/index.html ]; then
            echo "::error::webui build produced no internal/web/dist/index.html; the tagged build would not compile"
            exit 1
          fi

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
