name: CI

# Build, vet, format-check, test (with coverage), API/machine and adapter
# compatibility checks, production performance, staticcheck, race detection,
# SonarCloud analysis and vulnerability scan on every push to main and every pull request. Pure-Go,
# CGO disabled to match the release build; the race job re-enables CGO. The
# weekly schedule runs ONLY govulncheck (every other job carries an event_name
# guard, and sonar is skipped through its build-test dependency).
#
# There are no build tags: every gate runs once, over exactly the source the
# release binary is built from.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly run so newly-disclosed vulnerabilities in dependencies are caught
  # even when there are no new commits (the govulncheck job below — nothing
  # else runs on this trigger).
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: validate release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: check

      - name: require Kolkata timezone data
        run: test -r /usr/share/zoneinfo/Asia/Kolkata

      - name: gofmt (check formatting)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: test (with coverage)
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1 -covermode=atomic -coverprofile=coverage.out

      - name: enforce coverage floor
        run: |
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          if [ -z "$coverage" ]; then
            echo "::error::go tool cover did not report total statement coverage"
            exit 1
          fi
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 84.1) exit 1 }' || {
            echo "::error::statement coverage ${coverage}% is below the 84.1% floor"
            exit 1
          }
          echo "statement coverage ${coverage}%"

      - name: upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  staticcheck:
    name: staticcheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Pinned so a new staticcheck release cannot break CI on unchanged code.
      # v0.7.0 is the 2026.1 release; bump deliberately, alongside Go upgrades.
      # U1000 (unused code) is in the default check set, so dead-code
      # regressions fail the build.
      - name: staticcheck
        env:
          CGO_ENABLED: "0"
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

  race:
    name: race detector
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The race detector needs CGO. Cover the whole module: scoping to "the
      # concurrent packages" is how the sysmon race fixed in b9cc4ca stayed
      # invisible to CI.
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  sonar:
    name: SonarCloud scan
    # Reuses build-test's coverage artifact instead of re-running the suite.
    # The dependency also skips this job on the weekly schedule (build-test is
    # skipped there, so this job never starts).
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets Sonar attribute new code / blame accurately.
          fetch-depth: 0

      - name: Download coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        # Non-blocking: if the SonarCloud project is not yet provisioned (or the
        # token/org/key do not match), report it but do not fail the build. Once
        # SonarCloud is set up, the scan's own quality gate governs PR status.
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Explain skipped scan
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN is not configured, so the SonarCloud scan was skipped."
          echo "Add a repository secret named SONAR_TOKEN to enable this check."

  govulncheck:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        # govulncheck reports only vulns actually reachable from this code.
        # The binary is pinned for reproducibility; the vulnerability database
        # is fetched live either way, so pinning loses nothing.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  compatibility:
    name: API and machine compatibility
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: compare public Go API
        run: |
          mkdir -p compatibility
          ./scripts/check-api-compat.sh | tee compatibility/api.txt

      - name: compile external examples
        run: go test ./examples/...

      - name: verify version 1 machine fixtures
        run: |
          go test ./internal/report -run '^TestVersion1MachineFixtures$' -count=1 | tee compatibility/machine.txt
          go test ./internal/cmd -run '^TestCLIContract$' -count=1 | tee compatibility/cli.txt
          go test . -run '^TestProcessStreamsAndExitStatus$' -count=1 | tee compatibility/process.txt

      - name: upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility
          path: compatibility
          if-no-files-found: error

  adapter-compatibility:
    name: Adapter compatibility
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # A fixture test that forgets to isolate discovery must see an impossible
      # root, never a developer or runner installation. Keep this list aligned
      # with internal/cmd.discoveryEnv.
      CLAUDE_CONFIG_DIR: /nonexistent/aiusage-adapter-contract
      CLINE_DIR: /nonexistent/aiusage-adapter-contract
      CLINE_DATA_DIR: /nonexistent/aiusage-adapter-contract
      CLINE_SESSION_DATA_DIR: /nonexistent/aiusage-adapter-contract
      CLINE_DB_DATA_DIR: /nonexistent/aiusage-adapter-contract
      CODEX_HOME: /nonexistent/aiusage-adapter-contract
      COPILOT_OTEL_FILE_EXPORTER_PATH: /nonexistent/aiusage-adapter-contract
      CRUSH_GLOBAL_DATA: /nonexistent/aiusage-adapter-contract
      XDG_DATA_HOME: /nonexistent/aiusage-adapter-contract
      DSH_HOME: /nonexistent/aiusage-adapter-contract
      GOOSE_PATH_ROOT: /nonexistent/aiusage-adapter-contract
      HERMES_HOME: /nonexistent/aiusage-adapter-contract
      KIMI_CODE_HOME: /nonexistent/aiusage-adapter-contract
      KIMI_CODE_DATA_DIR: /nonexistent/aiusage-adapter-contract
      OPENCODE_DATA_DIR: /nonexistent/aiusage-adapter-contract
      PI_CODING_AGENT_DIR: /nonexistent/aiusage-adapter-contract
      PI_CODING_AGENT_SESSION_DIR: /nonexistent/aiusage-adapter-contract
      OPENCLAW_STATE_DIR: /nonexistent/aiusage-adapter-contract
      OPENCLAW_HOME: /nonexistent/aiusage-adapter-contract
      OPENCLAW_AGENT_DIR: /nonexistent/aiusage-adapter-contract
      QWEN_RUNTIME_DIR: /nonexistent/aiusage-adapter-contract
      QWEN_HOME: /nonexistent/aiusage-adapter-contract
      REASONIX_STATE_HOME: /nonexistent/aiusage-adapter-contract
      REASONIX_HOME: /nonexistent/aiusage-adapter-contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: prepare adapter evidence
        run: mkdir -p adapter-evidence

      - name: replay adapter contracts
        env:
          CGO_ENABLED: "0"
        run: |
          set -o pipefail
          go test -p 1 -count=1 ./adapter/... | tee adapter-evidence/tests.txt

      - name: validate adapter evidence manifest
        if: always()
        run: go run ./internal/adaptercompatcheck --mode ci --out adapter-evidence/result.json

      - name: upload adapter compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adapter-compatibility
          path: |
            adapter/compatibility.json
            adapter-evidence
          if-no-files-found: error

  performance-paired:
    name: Performance evidence / ${{ matrix.check_name }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample_set: primary
            check_name: paired workloads
          - sample_set: retry
            check_name: paired retry
    env:
      CGO_ENABLED: "0"
      GOMAXPROCS: "2"
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: prepare performance evidence
        run: mkdir -p performance-paired

      - name: install pinned benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260813145340-fd4a688df892

      - name: enforce paired performance contract
        env:
          AIUSAGE_PERF_SKIP_EXPORTS: "1"
          AIUSAGE_PERF_SAMPLE_SET: ${{ matrix.sample_set }}
          AIUSAGE_PERF_OUT: performance-paired
        run: ./scripts/performance-gate.sh

      - name: upload paired performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-paired-${{ matrix.sample_set }}
          path: performance-paired
          if-no-files-found: error

  performance-exports:
    name: Performance evidence / ${{ matrix.command }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        command: [export-json, export-csv, export-json-raw, export-csv-raw]
    env:
      CGO_ENABLED: "0"
      GOMAXPROCS: "2"
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: prepare export evidence
        run: mkdir -p performance

      - name: measure one-million-row export
        env:
          AIUSAGE_PERF_EXPORT_COMMAND: ${{ matrix.command }}
        run: ./scripts/performance-export-gate.sh

      - name: upload export evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.command }}
          path: performance
          if-no-files-found: error

  performance:
    name: Production performance
    if: github.event_name != 'schedule'
    needs: [performance-paired, performance-exports]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
      GOMAXPROCS: "2"
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: prepare combined evidence
        run: mkdir -p performance performance-primary performance-retry performance-exports

      - name: download primary paired evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: performance-paired-primary
          path: performance-primary

      - name: download retry paired evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: performance-paired-retry
          path: performance-retry

      - name: download export evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: performance-export-*
          path: performance-exports
          merge-multiple: true

      - name: install pinned benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260813145340-fd4a688df892

      - name: enforce complete production performance contract
        run: ./scripts/finalize-performance-gate.sh

      - name: upload complete performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance
          path: performance
          if-no-files-found: error
