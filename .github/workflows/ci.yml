name: CI

# Build, vet, format-check, test (with coverage), staticcheck, race detection,
# web UI build, SonarCloud analysis and vulnerability scan on every push to main
# and every pull request. Pure-Go, CGO disabled to match the release build; the
# race job re-enables CGO. The weekly schedule runs ONLY govulncheck (every
# other job carries an event_name guard, and sonar is skipped through its
# build-test dependency).
#
# Every Go gate runs TWICE: once plain, once with -tags webui. An untagged
# build, vet, staticcheck, test or govulncheck never loads a //go:build webui
# file, so without the second pass a compile error, a vet finding, a failing
# test or a reachable vulnerability behind the tag reaches a release tag
# unnoticed - the release binary is the tagged one. gofmt is tag-agnostic, so
# it runs once.
#
# The tagged passes need internal/web/dist to exist (embed_webui.go does
# //go:embed all:dist). CI plants a placeholder file there rather than running
# the Vite build: what the tagged passes check is the Go code behind the tag,
# not the assets. The real UI build is its own job (webui, below) and the real
# embed happens in release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly run so newly-disclosed vulnerabilities in dependencies are caught
  # even when there are no new commits (the govulncheck job below — nothing
  # else runs on this trigger).
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (check formatting)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: test (with coverage)
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1 -covermode=atomic -coverprofile=coverage.out

      - name: upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

      # --- same gates again, with the webui tag set ---

      - name: placeholder web UI assets
        run: |
          mkdir -p internal/web/dist/assets
          printf '<!doctype html><title>aiusage</title>\n' > internal/web/dist/index.html
          printf '/* placeholder */\n' > internal/web/dist/assets/placeholder.css

      - name: go vet (webui tag)
        env:
          CGO_ENABLED: "0"
        run: go vet -tags webui ./...

      - name: build (webui tag)
        env:
          CGO_ENABLED: "0"
        run: go build -tags webui ./...

      # No coverage profile here: the untagged run above is what SonarCloud
      # consumes, and a second profile would need a second report path in
      # sonar-project.properties.
      - name: test (webui tag)
        env:
          CGO_ENABLED: "0"
        run: go test -tags webui ./... -count=1

  staticcheck:
    name: staticcheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: placeholder web UI assets
        run: |
          mkdir -p internal/web/dist/assets
          printf '<!doctype html><title>aiusage</title>\n' > internal/web/dist/index.html
          printf '/* placeholder */\n' > internal/web/dist/assets/placeholder.css
      # Pinned so a new staticcheck release cannot break CI on unchanged code.
      # v0.7.0 is the 2026.1 release; bump deliberately, alongside Go upgrades.
      # U1000 (unused code) is in the default check set, so dead-code
      # regressions fail the build.
      - name: staticcheck
        env:
          CGO_ENABLED: "0"
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
          # The untagged pass above cannot see //go:build webui files at all,
          # so U1000 and friends never look at the embedded-UI code.
          staticcheck -tags webui ./...

  race:
    name: race detector
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      # The race detector needs CGO. Cover the whole module: scoping to "the
      # concurrent packages" is how the sysmon race fixed in b9cc4ca stayed
      # invisible to CI.
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: placeholder web UI assets
        run: |
          mkdir -p internal/web/dist/assets
          printf '<!doctype html><title>aiusage</title>\n' > internal/web/dist/index.html
          printf '/* placeholder */\n' > internal/web/dist/assets/placeholder.css

      # The embedded-UI server has its own goroutines (live push, websockets),
      # and they only exist in a tagged build.
      - name: go test -race (webui tag)
        env:
          CGO_ENABLED: "1"
        run: go test -race -tags webui -count=1 ./...

  webui:
    name: web UI
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          # Relative to the repository root: setup-node is an action, so the
          # working-directory default above does not apply to it.
          cache-dependency-path: webui/package-lock.json

      # ci, not install: the lockfile is the spec, and a drifting dependency
      # tree should fail here rather than be silently rewritten.
      - name: npm ci
        run: npm ci

      # `npm run build` typechecks too (tsc --noEmit && vite build). Running it
      # separately first costs seconds and names the failure: type error vs
      # bundler error.
      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

  sonar:
    name: SonarCloud scan
    # Reuses build-test's coverage artifact instead of re-running the suite.
    # The dependency also skips this job on the weekly schedule (build-test is
    # skipped there, so this job never starts).
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history lets Sonar attribute new code / blame accurately.
          fetch-depth: 0

      - name: Download coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        # Non-blocking: if the SonarCloud project is not yet provisioned (or the
        # token/org/key do not match), report it but do not fail the build. Once
        # SonarCloud is set up, the scan's own quality gate governs PR status.
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Explain skipped scan
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN is not configured, so the SonarCloud scan was skipped."
          echo "Add a repository secret named SONAR_TOKEN to enable this check."

  govulncheck:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      # The tagged pass below needs internal/web/dist to exist: embed_webui.go
      # does //go:embed all:dist and will not compile without it. Same
      # placeholder the other jobs plant.
      - name: placeholder web UI assets
        run: |
          mkdir -p internal/web/dist/assets
          printf '<!doctype html><title>aiusage</title>\n' > internal/web/dist/index.html
          printf '/* placeholder */\n' > internal/web/dist/assets/placeholder.css

      - name: govulncheck
        # govulncheck reports only vulns actually reachable from this code.
        # The binary is pinned for reproducibility; the vulnerability database
        # is fetched live either way, so pinning loses nothing.
        #
        # Reachability is computed per build configuration, so the untagged run
        # cannot see a single line behind //go:build webui - and the embedded-UI
        # code is the half that speaks HTTP and WebSocket to the network. The
        # tagged pass is where a vulnerable net/http path would actually show up.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
          govulncheck -tags webui ./...
